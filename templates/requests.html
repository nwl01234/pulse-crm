<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests - Company CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm sticky top-0 z-50 py-3 px-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-900">Company CRM</h1>
            <nav class="flex gap-4 text-sm">
                <a href="#" class="hover:text-blue-600">Dashboard</a>
                <a href="#requests" class="hover:text-blue-600">Requests</a>
                <a href="#stats" class="hover:text-blue-600">Statistics</a>
                <a href="#ai-chat" class="text-blue-600 font-medium">AI Chat</a>
            </nav>
        </div>
    </header>

    <main class="p-4 md:p-8 max-w-7xl mx-auto w-full">
        <section id="requests" x-show="true">
            <!-- Add New Request -->
            <div class="bg-white rounded-lg shadow-sm p-5 border mb-6">
                <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 14.364l-2.828-2.828M21 10l-6-6m2.5 6.5a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    New Request
                </h2>

                <form @submit.prevent="createRequest()">
                    <div class="mb-4">
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                        <input type="text" id="title" name="title" required placeholder="Enter request title" class="w-full border rounded px-3 py-2 focus:outline-none focus:border-blue-400">
                    </div>

                    <div class="mb-4">
                        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea id="description" name="description" placeholder="Enter request description..." rows="3" class="w-full border rounded px-3 py-2 focus:outline-none focus:border-blue-400 resize-none"></textarea>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div>
                            <label for="priority" class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                            <select id="priority" name="priority" class="w-full border rounded px-3 py-2 focus:outline-none focus:border-blue-400">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high" selected>High</option>
                                <option value="critical">Critical</option>
                            </select>
                        </div>

                        <div>
                            <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <input type="text" id="category" name="category" placeholder="Enter category" class="w-full border rounded px-3 py-2 focus:outline-none focus:border-blue-400">
                        </div>

                        <div>
                            <label for="assignee" class="block text-sm font-medium text-gray-700 mb-1">Assign To</label>
                            <select id="assignee" name="assignee" class="w-full border rounded px-3 py-2 focus:outline-none focus:border-blue-400">
                                <option value="">Unassigned</option>
                                <option value="alice@company.com">Alice Smith</option>
                                <option value="bob@company.com">Bob Johnson</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-sm font-medium text-gray-700 mb-1">AI Analysis</label>
                            <button type="button" @click="analyzeRequest()" class="w-full bg-purple-50 border border-purple-400 hover:bg-purple-100 text-purple-600 font-medium py-2 px-4 rounded transition-colors flex items-center justify-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.5 6.5l.707.707M15.828 9.5a2 2 0 010 2.828M21 12l-6-6m2.5 6.5a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                AI Analyze
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition-colors">Create Request</button>
                </form>

                <!-- AI Analysis Result -->
                <template x-show="aiResult" class="mt-4 p-3 bg-purple-50 border border-purple-200 rounded">
                    <div class="flex gap-2 items-start">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.5 6.5l.707.707M15.828 9.5a2 2 0 010 2.828M21 1
